[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates (layering is enforced by `cargo xtask ci`, see CLAUDE.md).
bluepane-vfs = { path = "crates/vfs" }
bluepane-ops = { path = "crates/ops" }
bluepane-archive = { path = "crates/archive" }
bluepane-sync = { path = "crates/sync" }
bluepane-rename = { path = "crates/rename" }
bluepane-search = { path = "crates/search" }
bluepane-remote = { path = "crates/remote" }
bluepane-docs = { path = "crates/docs" }
bluepane-engine = { path = "crates/engine" }
bluepane-ui-egui = { path = "crates/ui-egui" }

# External.
egui = "0.36"
eframe = "0.36"
trash = "5"
tempfile = "3"
# Archives: ZIP (deflate + AES-256 encryption), TAR, gzip.
zip = { version = "9", default-features = false, features = ["deflate", "aes-crypto", "unreserved"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
# 7z (pure Rust): LZMA/LZMA2, AES-256 and header encryption. No BZip2/PPMd: they pull in C code.
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "compress"] }
# Regular expressions for multi-rename search and replace.
regex = "1"
# SFTP over SSH (pure Rust, no C library): the async client and server run on a tokio runtime
# that the sftp crate owns and hides behind a blocking API.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
rand = "0.10"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
# FTP and FTPS (TLS through rustls with ring, no C library to install).
suppaftp = { version = "12", default-features = false, features = ["rustls-ring", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
rcgen = "0.14"
# System password store (Secret Service on Linux via pure-Rust zbus, Credential Manager on Windows).
keyring = "4"
# Text of PDF files for the preview (pure Rust).
pdf-extract = "0.12"
# Local-time formatting of modification dates (no default features: no wasm/serde/etc.).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
