[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates (layering is enforced by `cargo xtask ci`, see CLAUDE.md).
bluepane-vfs = { path = "crates/vfs" }
bluepane-ops = { path = "crates/ops" }
bluepane-engine = { path = "crates/engine" }
bluepane-ui-egui = { path = "crates/ui-egui" }

# External.
egui = "0.36"
eframe = "0.36"
trash = "5"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
