[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mateuszlenart-pixel/bluepane"
publish = false

[workspace.dependencies]
# Internal crates (layering is enforced by `cargo xtask ci`, see CLAUDE.md).
bluepane-vfs = { path = "crates/vfs" }
bluepane-ops = { path = "crates/ops" }
bluepane-archive = { path = "crates/archive" }
bluepane-sync = { path = "crates/sync" }
bluepane-rename = { path = "crates/rename" }
bluepane-search = { path = "crates/search" }
bluepane-remote = { path = "crates/remote" }
bluepane-docs = { path = "crates/docs" }
bluepane-text = { path = "crates/text" }
bluepane-netscan = { path = "crates/netscan" }
bluepane-engine = { path = "crates/engine" }
bluepane-ui-egui = { path = "crates/ui-egui" }

# External.
egui = "0.36"
# Headless GUI tests (the widget tree, clicks); no snapshots, so no GPU is needed in CI.
egui_kittest = "0.36"
# Icon font built into the program (file type icons in the panels).
egui-phosphor = "0.14"
# Free and total space of a drive (one safe call on Windows and Linux).
fs4 = { version = "1", default-features = false }
notify = "8"
# Docking: panels and tools as tabs that can be dragged, split and saved (layout in JSON).
egui_dock = { version = "0.21", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.36"
trash = "5"
tempfile = "3"
# Archives: ZIP (deflate + AES-256 encryption), TAR, gzip.
zip = { version = "9", default-features = false, features = ["deflate", "aes-crypto", "unreserved"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
# 7z (pure Rust): LZMA/LZMA2, AES-256 and header encryption. No BZip2/PPMd: they pull in C code.
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "compress"] }
# Regular expressions for multi-rename search and replace.
regex = "1"
# Multi-rename from file data: the date and camera in a photo's EXIF, tags of audio files (both pure Rust).
kamadak-exif = "0.6"
lofty = "0.22"
# SFTP over SSH (pure Rust, no C library): the async client and server run on a tokio runtime
# that the sftp crate owns and hides behind a blocking API.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
rand = "0.10"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
# FTP and FTPS (TLS through rustls with ring, no C library to install).
suppaftp = { version = "12.2.1", default-features = false, features = ["rustls-ring", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
md-5 = "0.10"
rcgen = "0.14"
# System password store (Secret Service on Linux via pure-Rust zbus, Credential Manager on Windows).
keyring = "4"
# Text of PDF files for the fallback preview, and PDF page rendering (both pure Rust).
pdf-extract = "0.12"
hayro = { version = "0.8", features = ["embed-fonts"] }
# Pictures for the viewer and Quick View; only the common formats, no threads pool.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
# Network scanner: reverse DNS names and the manufacturer behind a MAC address.
dns-lookup = "4"
oui-data = "0.2"
# Local-time formatting of modification dates (no default features: no wasm/serde/etc.).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
