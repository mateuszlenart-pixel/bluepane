name: Wydanie

# Buduje paczki wydania (Linux i Windows) i, po wypchnięciu tagu `vX.Y.Z`, wystawia je na stronie
# Releases razem z sumami SHA-256 i notatkami z CHANGELOG.md. Tag musi zgadzać się z wersją
# w Cargo.toml. Uruchomienie ręczne (workflow_dispatch) i zmiana tego pliku budują same paczki
# jako artefakty, bez wydania: to próba generalna.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "tools/wersja.sh"
      - "tools/wydanie-notatki.sh"
      - "installer/**"
      - "CHANGELOG.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: wersja i notatki
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version (and tag check)
        id: version
        run: |
          tag=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          echo "version=$(tools/wersja.sh $tag)" >> "$GITHUB_OUTPUT"
      - name: Release notes
        run: tools/wydanie-notatki.sh "${{ steps.version.outputs.version }}" | tee notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md
          retention-days: 14

  build:
    name: ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Starszy Ubuntu: plik działa też na starszych dystrybucjach (nowsza biblioteka libc).
          - { os: ubuntu-22.04, name: linux }
          - { os: windows-latest, name: windows }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgtk-3-dev
      # Wersja dla użytkownika: na Windows bez okna konsoli (bez funkcji `console`).
      - name: Build (release)
        run: cargo build --release -p bluepane -p bluepane-cli

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="bluepane-${VERSION}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/bluepane target/release/bluepane-cli "dist/$name/"
          cp LICENSE-MIT LICENSE-APACHE README.md CHANGELOG.md "dist/$name/"
          cp -r docs "dist/$name/"
          tar -czf "$name.tar.gz" -C dist "$name"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "bluepane-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/bluepane.exe, target/release/bluepane-cli.exe "dist/$name/"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md, CHANGELOG.md, apps/bluepane/assets/icon.ico "dist/$name/"
          Copy-Item -Recurse docs "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"
      - name: Installer (Windows, Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            foreach ($dir in "${env:ProgramFiles(x86)}\Inno Setup 6", "$env:ProgramFiles\Inno Setup 6") {
              if (Test-Path "$dir\ISCC.exe") { $iscc = "$dir\ISCC.exe"; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $name = "bluepane-$env:VERSION-windows-x86_64"
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\$name" "/DOutDir=$PWD" installer\bluepane.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc zakończył się kodem $LASTEXITCODE" }
          Get-ChildItem bluepane-*-setup.exe
      - name: Installer test (silent install, run, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem bluepane-*-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'Zażółć bluepane'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$dir`"",'/TASKS=desktopicon' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "instalacja: kod $($p.ExitCode)" }
          foreach ($f in 'bluepane.exe','bluepane-cli.exe','LICENSE-MIT','CHANGELOG.md','docs\KOMENDY.md','unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "po instalacji brak pliku: $f" }
          }
          $v = & "$dir\bluepane-cli.exe" --version
          if ($v -ne "bluepane-cli $env:VERSION") { throw "zła wersja po instalacji: $v" }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "odinstalowanie: kod $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\bluepane.exe") { throw 'po odinstalowaniu bluepane.exe nadal jest' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: paczka-linux
          path: bluepane-*.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: paczka-windows
          path: |
            bluepane-*.zip
            bluepane-*-setup.exe
          retention-days: 14

  release:
    name: wydanie na GitHubie
    # Tylko po tagu; ręczne uruchomienie i pull request kończą się na paczkach.
    if: github.ref_type == 'tag'
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        working-directory: files
        run: |
          sha256sum bluepane-* | tee SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" files/bluepane-* files/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "bluepane ${{ needs.meta.outputs.version }}" \
            --notes-file files/notes.md
